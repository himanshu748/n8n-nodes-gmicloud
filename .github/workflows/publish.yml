# A version tag such as 0.1.1 triggers this workflow. Run npm run release
# locally to create and push a release tag.
#
# Configure this package's trusted publisher on npmjs.com:
#   Provider: GitHub Actions
#   Organization or user: himanshu748
#   Repository: n8n-nodes-gmicloud
#   Workflow filename: publish.yml
#   Environment: leave blank
#   Allowed operation: npm publish

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Set up npm with Trusted Publishing support
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Release
        # n8n-node runs lint and build and publishes with provenance via npm OIDC.
        run: npm run release
        env:
          NPM_CONFIG_ACCESS: public
